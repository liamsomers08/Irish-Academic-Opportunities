name: Production browser smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'apps-script/**'
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://liamsomers08.github.io/Irish-Academic-Opportunities/
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for GitHub Pages production origin
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location "$PRODUCTION_URL" | grep -q 'Irish Academic Opportunities Finder'; then
              exit 0
            fi
            sleep 10
          done
          echo '::error::Production GitHub Pages origin did not become healthy.'
          exit 1

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npm run test:production

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
