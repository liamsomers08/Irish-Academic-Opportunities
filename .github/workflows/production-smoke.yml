name: Production browser smoke

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'apps-script/**'
  workflow_run:
    workflows: ['Deploy Apps Script backend']
    types: [completed]
  schedule:
    - cron: '20 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-browser-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://liamsomers08.github.io/Irish-Academic-Opportunities/
      RELEASE_FILE: geo-search.js
      RELEASE_MARKER: 'geo-search-2026-08-25a'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Wait for current GitHub Pages release
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            script="$(curl --fail --silent --show-error --location "${PRODUCTION_URL}${RELEASE_FILE}" || true)"
            if printf '%s' "$script" | grep -Fq "$RELEASE_MARKER"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Current ${RELEASE_FILE} release marker did not become available."
          exit 1

      - name: Install test dependencies
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run production smoke tests
        run: npm run test:production

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-diagnostics-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
